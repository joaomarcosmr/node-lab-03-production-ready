services:
  postgres:
    image: postgres:16-alpine
    container_name: lab03-postgres
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: lab
    ports:
      - "5443:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab"]
      interval: 2s
      timeout: 2s
      retries: 15
  redis:
    image: redis:7-alpine
    container_name: lab03-redis
    ports:
      - "6381:6379"
  # When you get to the container criteria, add your API here, e.g.:
  # api:
  #   build: .
  #   environment:
  #     PORT: 3000
  #     API_TOKEN: change-me
  #     DATABASE_URL: postgresql://lab:lab@postgres:5432/lab?schema=public
  #     REDIS_URL: redis://redis:6379
