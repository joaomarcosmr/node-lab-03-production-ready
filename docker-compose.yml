services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10
  # Add your app here when you get to the Docker criteria, e.g.:
  # app:
  #   build: .
  #   environment: { PORT: 3000, REDIS_URL: "redis://redis:6379" }
  #   depends_on: { redis: { condition: service_healthy } }
  #   deploy: { replicas: 2 }
